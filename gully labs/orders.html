<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders | Gully Labs</title>
  <link rel="stylesheet" href="orders.css" />
</head>
<body>
  <div class="orders-wrap">
    <div class="orders-card">
      <h1>My Orders</h1>
      <form id="ordersForm" class="orders-form">
        <input type="email" id="ordersEmail" placeholder="Enter your email" required />
        <button type="submit" id="ordersBtn">View Orders</button>
      </form>

      <div id="ordersMessage" class="orders-message"></div>
      <div id="ordersList" class="orders-list"></div>
    </div>
  </div>

  <script src="orders.js"></script>
</body>
</html>
