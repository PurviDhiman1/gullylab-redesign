<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — Gully Labs</title>
  <link rel="stylesheet" href="success.css" />
</head>
<body>
  <main class="success-wrap">
    <div class="success-card">
      <div class="success-icon">✓</div>
      <p class="eyebrow">Order Confirmed</p>
      <h1>Thank you for your order</h1>
      <p class="sub">
        Your order has been placed successfully.
      </p>

      <div class="row">
        <span>Order ID</span>
        <strong id="orderId">-</strong>
      </div>

      <div class="success-box">
        <div class="row">
          <span>Name</span>
          <strong id="orderName">-</strong>
        </div>
        <div class="row">
          <span>Phone</span>
          <strong id="orderPhone">-</strong>
        </div>
        <div class="row">
          <span>Total</span>
          <strong id="orderTotal">-</strong>
        </div>
        <div class="row">
          <span>Payment</span>
          <strong id="orderPayment">-</strong>
        </div>
        <div class="row address-row">
          <span>Delivery Address</span>
          <strong id="orderAddress">-</strong>
        </div>
      </div>

      <div class="success-actions">
        <a href="shop.html" class="btn btn-dark">Continue Shopping</a>
        <a href="track-order.html" class="btn btn-light">Track My Order</a>
      </div>
    </div>
  </main>

  <script src="success.js"></script>
</body>
</html>
